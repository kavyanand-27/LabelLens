server:
  port: 8080

spring:
  application:
    name: labellens-backend
  datasource:
    # Defaults to file-based H2 for instant out-of-the-box local operation without external setup,
    # or overrides via standard SPRING_DATASOURCE_URL for PostgreSQL in docker/production
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/labellensdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"
